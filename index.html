<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIENCIAS DE LA TIERRA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --azul: #001f3f; --oro: #b8860b; --blanco: #ffffff; --fondo: #f4f7f9; }
        body { background-color: var(--fondo); font-family: 'Inter', sans-serif; color: #333; margin: 0; }
        
        .navbar-minimal { padding: 20px 0; background: var(--blanco); border-bottom: 1px solid #e1e8ed; text-align: center; }
        .nav-logo { font-weight: 800; letter-spacing: 4px; color: var(--azul); text-transform: uppercase; font-size: 1.2rem; }
        
        .main-container { max-width: 850px; margin: 40px auto; padding: 0 15px; }
        .titulo-header { font-weight: 800; color: var(--azul); text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-bottom: 30px; font-size: 2rem; }
        
        .card-premium { background: var(--blanco); border-radius: 20px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.08); border-top: 6px solid var(--oro); }
        .portada-img { width: 100%; height: auto; display: block; }
        
        .content-area { padding: 40px; }
        .section-title { color: var(--azul); font-weight: 700; border-bottom: 2px solid var(--fondo); padding-bottom: 15px; margin-bottom: 25px; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        
        .form-label { font-weight: 700; color: var(--azul); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .form-control, .form-select { border-radius: 10px; padding: 12px; border: 1px solid #dce4ec; background-color: #fcfdfe; margin-bottom: 15px; }
        
        .btn-inscripcion { background: var(--azul); color: white; width: 100%; padding: 18px; font-weight: 800; border-radius: 12px; border: none; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; margin-top: 10px; cursor: pointer; }
        .btn-inscripcion:hover { background: var(--oro); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(184, 134, 11, 0.3); }
        
        .grid-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-box { background: var(--fondo); padding: 15px; border-radius: 12px; text-align: center; }
        .stat-box span { display: block; font-size: 0.7rem; font-weight: 700; color: #7f8c8d; text-transform: uppercase; }
        .stat-box strong { font-size: 1rem; color: var(--azul); }

        .insta-footer { display: block; text-align: center; margin-top: 30px; color: #E1306C; text-decoration: none; font-weight: 700; font-size: 1.1rem; }
        footer { padding: 50px 0; color: #bdc3c7; font-size: 0.75rem; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<nav class="navbar-minimal">
    <div class="container"><span class="nav-logo">CIENCIAS DE LA TIERRA</span></div>
</nav>

<div class="container main-container">
    <h1 class="titulo-header">APRENDIENDO SOBRE LAS GEOCIENCIAS</h1>
    
    <div class="card-premium">
        <img src="currr.png" alt="Bases de las Geociencias Modernas" class="portada-img">
        
        <div class="content-area">
            <div class="grid-stats">
                <div class="stat-box"><span>Duración</span><strong>40 Horas</strong></div>
                <div class="stat-box"><span>Inversión</span><strong>Gratuito</strong></div>
                <div class="stat-box"><span>Acreditación</span><strong>Certificada</strong></div>
            </div>

            <h2 class="section-title">Registro de Inscripción</h2>
            
            <form action="https://formspree.io/f/xqewjqll" method="POST">
                <div class="row">
                    <div class="col-12">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" name="Nombre" class="form-control" placeholder="Escríbelo para tu certificado" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" name="Email" class="form-control" placeholder="tu@email.com" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">WhatsApp</label>
                        <input type="tel" name="WhatsApp" class="form-control" placeholder="+52..." required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Ocupación / Perfil profesional</label>
                        <select name="Perfil" class="form-select">
                            <option value="estudiante">Estudiante Universitario</option>
                            <option value="ingeniero">Ingeniero / Profesional</option>
                            <option value="aficionado">Entusiasta de las geociencias</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-inscripcion">Confirmar mi lugar</button>
            </form>

            <a href="https://www.instagram.com/yxe.geo" target="_blank" class="insta-footer">
                <i class="bi bi-instagram"></i> SÍGUEME EN @YXE.GEO
            </a>
        </div>
    </div>

    <footer>
        © 2026 Joel • Ingeniero en Geociencias • TecNM
    </footer>
</div>

</body>
</html>
