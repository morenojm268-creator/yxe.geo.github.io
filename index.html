<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIENCIAS DE LA TIERRA | ACADEMIA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { 
            --azul-profundo: #001f3f; 
            --oro-noble: #b8860b; 
            --blanco-puro: #ffffff; 
            --fondo-gris: #f0f2f5; 
            --texto-suave: #555;
        }

        body { 
            background-color: var(--fondo-gris); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            color: #222; 
            margin: 0; 
        }

        /* Navbar Minimalista */
        .navbar-minimal { 
            padding: 18px 0; 
            background: var(--blanco-puro); 
            border-bottom: 2px solid rgba(0,0,0,0.05); 
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-logo { 
            font-weight: 900; 
            letter-spacing: 5px; 
            color: var(--azul-profundo); 
            text-transform: uppercase; 
            font-size: 1.1rem; 
        }

        .main-container { 
            max-width: 900px; 
            margin: 50px auto; 
            padding: 0 20px; 
        }

        .titulo-header { 
            font-weight: 800; 
            color: var(--azul-profundo); 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            text-align: center; 
            margin-bottom: 35px; 
            font-size: 1.8rem;
        }

        /* Tarjeta Principal */
        .card-premium { 
            background: var(--blanco-puro); 
            border-radius: 24px; 
            overflow: hidden; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            border: none;
        }

        .portada-container {
            position: relative;
        }

        .portada-img { 
            width: 100%; 
            height: auto; 
            display: block; 
            transition: transform 0.5s ease;
        }

        .card-premium:hover .portada-img {
            transform: scale(1.02);
        }

        .content-area { padding: 50px; }

        /* Stats de diseño moderno */
        .grid-stats { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
            margin-bottom: 40px; 
        }
        .stat-box { 
            background: #f8fafc; 
            padding: 20px; 
            border-radius: 16px; 
            text-align: center;
            border: 1px solid #edf2f7;
        }
        .stat-box i { color: var(--oro-noble); font-size: 1.2rem; margin-bottom: 8px; display: block; }
        .stat-box span { display: block; font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .stat-box strong { font-size: 0.95rem; color: var(--azul-profundo); }

        .section-title { 
            color: var(--azul-profundo); 
            font-weight: 800; 
            margin-bottom: 30px; 
            text-align: center; 
            text-transform: uppercase; 
            font-size: 1.2rem;
            position: relative;
        }
        .section-title::after {
            content: "";
            width: 50px;
            height: 3px;
            background: var(--oro-noble);
            display: block;
            margin: 10px auto 0;
        }

        /* Formulario Estilizado */
        .form-label { 
            font-weight: 700; 
            color: var(--azul-profundo); 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            margin-bottom: 10px; 
            padding-left: 5px;
        }
        .form-control, .form-select { 
            border-radius: 12px; 
            padding: 14px; 
            border: 2px solid #f1f4f8; 
            background-color: #f8fafc; 
            margin-bottom: 20px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-select:focus { 
            border-color: var(--oro-noble); 
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(184, 134, 11, 0.1);
            outline: none; 
        }

        .btn-inscripcion { 
            background: var(--azul-profundo); 
            color: white; 
            width: 100%; 
            padding: 20px; 
            font-weight: 800; 
            border-radius: 15px; 
            border: none; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            transition: all 0.4s ease; 
            margin-top: 15px; 
            font-size: 1rem;
        }
        .btn-inscripcion:hover { 
            background: #003366; 
            transform: translateY(-3px); 
            box-shadow: 0 10px 20px rgba(0, 31, 63, 0.2); 
        }

        .insta-footer { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: 40px; 
            color: #E1306C; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 1rem;
            transition: 0.3s;
        }
        .insta-footer:hover { opacity: 0.8; transform: scale(1.05); }

        footer { 
            padding: 60px 0; 
            color: #94a3b8; 
            font-size: 0.7rem; 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }
    </style>
</head>
<body>

<nav class="navbar-minimal">
    <div class="container"><span class="nav-logo">CIENCIAS DE LA TIERRA</span></div>
</nav>

<div class="container main-container">
    <h1 class="titulo-header">APRENDIENDO SOBRE LAS GEOCIENCIAS</h1>
    
    <div class="card-premium">
        <div class="portada-container">
            <img src="currr.png" alt="Bases de las Geociencias Modernas" class="portada-img">
        </div>
        
        <div class="content-area">
            <div class="grid-stats">
                <div class="stat-box">
                    <i class="bi bi-clock-history"></i>
                    <span>Duración</span><strong>40 Horas</strong>
                </div>
                <div class="stat-box">
                    <i class="bi bi-currency-dollar"></i>
                    <span>Inversión</span><strong>Gratuito</strong>
                </div>
                <div class="stat-box">
                    <i class="bi bi-patch-check"></i>
                    <span>Nivel</span><strong>Certificado</strong>
                </div>
            </div>

            <h2 class="section-title">Inscripción al Programa</h2>
            
            <form action="https://formspree.io/f/xqewjqll" method="POST">
                <div class="row">
                    <div class="col-12">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" name="Nombre_Completo" class="form-control" placeholder="Nombre como aparecerá en el certificado" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Correo Electrónico Institucional o Personal</label>
                        <input type="email" name="Email" class="form-control" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Área de Interés / Perfil</label>
                        <select name="Perfil_Profesional" class="form-select">
                            <option value="estudiante">Estudiante de Ingeniería</option>
                            <option value="ingeniero">Ingeniero / Geólogo Egresado</option>
                            <option value="investigador">Investigador Académico</option>
                            <option value="aficionado">Entusiasta de la Geología</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-inscripcion">Finalizar Registro</button>
            </form>

            <a href="https://www.instagram.com/yxe.geo" target="_blank" class="insta-footer">
                <i class="bi bi-instagram"></i> @YXE.GEO
            </a>
        </div>
    </div>

    <footer>
        © 2026 Joel • Ingeniero en Geociencias • TecNM <br>
        Desarrollado para la comunidad geocientífica
    </footer>
</div>

</body>
</html>
