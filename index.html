<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendiendo sobre las geociencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --azul-profundo: #001f3f; --dorado-suave: #b8860b; }
        body { background-color: #ffffff; color: #333; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-container { max-width: 900px; margin: 50px auto; padding: 20px; text-align: center; }
        .titulo-principal { color: var(--azul-profundo); font-weight: 700; margin-bottom: 30px; font-size: 2.5rem; }
        .cert-img { width: 100%; height: auto; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); margin-bottom: 40px; border: 1px solid #eee; }
        .detalles { border-top: 2px solid #f0f0f0; padding-top: 30px; }
        .btn-espera { background-color: #444; color: white; padding: 12px 35px; border-radius: 50px; text-decoration: none; display: inline-block; font-weight: 600; margin-top: 25px; border: none; cursor: not-allowed; }
        .insta-link { color: #E1306C; text-decoration: none; font-weight: 600; font-size: 1.1rem; transition: 0.3s; }
        .insta-link:hover { opacity: 0.7; }
        footer { margin-top: 80px; color: #888; font-size: 0.9rem; padding-bottom: 40px; }
    </style>
</head>
<body>

<div class="main-container">
    <h1 class="titulo-principal">Aprendiendo sobre las geociencias</h1>
    
    <img src="ChatGPT Image 24 abr 2026, 12_58_06 p.m..png" alt="Curso Bases de las Geociencias Modernas" class="cert-img">
    
    <div class="detalles">
        <h3 class="fw-bold">Bases de las Geociencias Modernas</h3>
        <p class="text-muted">Geología • Geofísica • GIS</p>
        
        <div class="row mt-4 fw-bold text-uppercase" style="letter-spacing: 1px; color: var(--dorado-suave);">
            <div class="col">40 Horas</div>
            <div class="col">Gratuito</div>
            <div class="col">Certificado</div>
        </div>

        <button class="btn-espera" disabled>PRÓXIMAMENTE - MAYO 2026</button>
        
        <div class="mt-4">
            <a href="https://www.instagram.com/yxe.geo" target="_blank" class="insta-link">
                <i class="bi bi-instagram"></i> Sígueme en @yxe.geo
            </a>
        </div>
    </div>

    <footer>
        © 2026 Joel | Ingeniero en Geociencias
    </footer>
</div>

</body>
</html>
